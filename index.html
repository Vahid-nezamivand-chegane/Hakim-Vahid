<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakim Vahid | حكيم وحيد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ... (همان استایل‌های قبلی بدون تغییر) ... */
        :root {
            --bg-dark: #050810; --glass-bg: rgba(15, 23, 42, 0.6);
            --primary: #10b981; --primary-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1); --gold: #eab308;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 27, 75, 0.8) 0%, transparent 70%), radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            background-attachment: fixed; color: var(--text-main); font-family: 'Inter', 'Cairo', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden;
        }
        [dir="rtl"] body { font-family: 'Cairo', 'Inter', sans-serif; }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1; pointer-events: none;
        }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .lang-switch {
            position: absolute; top: 20px; right: 20px; display: flex; gap: 10px;
            background: var(--glass-bg); backdrop-filter: blur(10px); padding: 5px; border-radius: 30px; border: 1px solid var(--border);
        }
        [dir="rtl"] .lang-switch { right: auto; left: 20px; }
        .lang-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.3s ease; }
        .lang-btn.active { background: var(--primary); color: #fff; box-shadow: 0 0 15px var(--primary-glow); }
        .brand { text-align: center; margin-bottom: 40px; margin-top: 50px; }
        .brand h1 {
            font-size: 3.5rem; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #10b981 50%, #3b82f6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; text-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }
        .brand p { color: var(--text-muted); font-size: 1rem; font-weight: 600; letter-spacing: 1px; }
        .tools { display: flex; gap: 12px; overflow-x: auto; width: 100%; padding-bottom: 15px; margin-bottom: 25px; scrollbar-width: none; }
        .tools::-webkit-scrollbar { display: none; }
        .tool { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 15px 20px; border-radius: 16px; cursor: pointer; text-align: center; min-width: 110px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tool:hover, .tool.active { border-color: var(--primary); background: rgba(16, 185, 129, 0.1); transform: translateY(-5px); box-shadow: 0 10px 25px var(--primary-glow); }
        .tool-icon { font-size: 1.8rem; margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .tool-name { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
        .chat-container { width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05); }
        .chat-output { height: 350px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { padding: 15px 20px; border-radius: 16px; max-width: 85%; line-height: 1.6; font-size: 0.95rem; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-ai { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        [dir="rtl"] .msg-ai { align-self: flex-start; border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
        .msg-user { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 5px 15px var(--primary-glow); }
        [dir="rtl"] .msg-user { align-self: flex-end; border-bottom-right-radius: 16px; border-bottom-left-radius: 4px; }
        .highlight { color: var(--gold); font-weight: bold; }
        .input-area { display: flex; gap: 12px; position: relative; }
        input[type="text"] { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); color: var(--text-main); padding: 18px 20px; border-radius: 16px; font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); background: rgba(0, 0, 0, 0.6); }
        button.send-btn { background: var(--primary); color: #fff; border: none; padding: 0 30px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; box-shadow: 0 0 20px var(--primary-glow); }
        button.send-btn:hover { background: #059669; transform: scale(1.05); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--glass-bg); backdrop-filter: blur(30px); padding: 40px 30px; border-radius: 24px; width: 90%; max-width: 420px; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1); animation: zoomIn 0.4s ease; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { margin-bottom: 25px; color: #fff; text-align: center; font-size: 1.8rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--text-main); font-family: inherit; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        .email-group { display: flex; gap: 10px; }
        .email-group input { flex: 1; }
        .email-group button { padding: 0 15px; background: transparent; border: 1px solid var(--primary); color: var(--primary); border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .email-group button:hover { background: rgba(16, 185, 129, 0.1); }
        .modal > button { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 15px; transition: 0.3s; box-shadow: 0 0 20px var(--primary-glow); }
        .modal > button:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLang('en')" id="btn-en">EN</button>
        <button class="lang-btn" onclick="setLang('ar')" id="btn-ar">AR</button>
    </div>

    <div class="container">
        <div class="brand">
            <h1 id="brand-title">Hakim Vahid</h1>
            <p id="brand-sub">The Ultimate AI Hub</p>
        </div>

        <div class="tools">
            <div class="tool active" onclick="selectTool('chat', this)">
                <div class="tool-icon">💬</div>
                <div class="tool-name" id="tool-chat">Chat</div>
            </div>
            <div class="tool" onclick="selectTool('image', this)">
                <div class="tool-icon">🎨</div>
                <div class="tool-name" id="tool-image">Image</div>
            </div>
            <div class="tool" onclick="selectTool('excel', this)">
                <div class="tool-icon">📊</div>
                <div class="tool-name" id="tool-excel">Excel</div>
            </div>
            <div class="tool" onclick="selectTool('pdf', this)">
                <div class="tool-icon">📄</div>
                <div class="tool-name" id="tool-pdf">PDF</div>
            </div>
            <div class="tool" onclick="selectTool('word', this)">
                <div class="tool-icon">📝</div>
                <div class="tool-name" id="tool-word">Word</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-output" id="chat-output">
                <div class="message msg-ai" id="welcome-msg"></div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Ask Hakim anything..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()" id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- Onboarding Modal -->
    <div class="modal-overlay" id="onboarding-modal">
        <div class="modal">
            <h2 id="modal-title">Access Hakim Vahid</h2>
            
            <div class="form-group">
                <label id="label-email">Email Address</label>
                <div class="email-group">
                    <input type="email" id="input-email" placeholder="you@example.com">
                    <button type="button" onclick="sendVerificationCode()" id="btn-send-code">Send Code</button>
                </div>
            </div>

            <div class="form-group" id="verify-group" style="display: none;">
                <label id="label-code">Verification Code</label>
                <input type="text" id="input-code" placeholder="Enter 6-digit code" maxlength="6">
            </div>

            <div class="form-group">
                <label id="label-age">Age</label>
                <input type="number" id="input-age" placeholder="e.g., 25" min="1">
            </div>

            <div class="form-group">
                <label id="label-role">Your Profession</label>
                <input type="text" id="input-role" placeholder="Engineer, Doctor, Student...">
            </div>

            <div class="form-group">
                <label id="label-goal">Primary Goal</label>
                <select id="input-goal">
                    <option value="writing">Writing & Research</option>
                    <option value="coding">Coding & Analysis</option>
                    <option value="business">Business & Finance</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <button onclick="submitOnboarding()" id="btn-start">Initialize Platform</button>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let currentTool = 'chat';
        
        // Verification variables
        let generatedCode = null;
        let codeExpiryTime = null;
        let codeTimerInterval = null;

        const translations = {
            en: {
                brandSub: "The Ultimate AI Hub",
                toolChat: "Chat", toolImage: "Image", toolExcel: "Excel", toolPdf: "PDF", toolWord: "Word",
                welcome: "Greetings. I am <span class='highlight'>Hakim Vahid</span>. I am not just an AI; I am an advanced super-intelligence and the ultimate unified platform, possessing the convergence of all AI capabilities in one place. Created by <span class='highlight'>Vahid Nezamivand Chegane</span>.",
                inputPlaceholder: "Ask Hakim anything...",
                sendBtn: "Send",
                modalTitle: "Access Hakim Vahid",
                labelEmail: "Email Address", labelCode: "Verification Code", labelAge: "Age", labelRole: "Your Profession", labelGoal: "Primary Goal",
                btnStart: "Initialize Platform",
                btnSendCode: "Send Code",
                codeSent: "Code Sent!",
                enterCode: "Enter 6-digit code"
            },
            ar: {
                brandSub: "المركز العالمي للذكاء الاصطناعي",
                toolChat: "محادثة", toolImage: "صورة", toolExcel: "إكسل", toolPdf: "بي دي إف", toolWord: "وورد",
                welcome: "تحياتي. أنا <span class='highlight'>حكيم وحيد</span>. أنا لست مجرد ذكاء اصطناعي؛ بل أنا ذكاء خارق متقدم ومنصة موحدة شاملة، أمتلك تقارب جميع قدرات الذكاء الاصطناعي في مكان واحد. صممه <span class='highlight'>وحيد نظامي وند تشيغانه</span>.",
                inputPlaceholder: "اسأل حكيماً أي شيء...",
                sendBtn: "إرسال",
                modalTitle: "دخول حكيم وحيد",
                labelEmail: "البريد الإلكتروني", labelCode: "رمز التحقق", labelAge: "العمر", labelRole: "مهنتك", labelGoal: "الهدف الأساسي",
                btnStart: "تهيئة المنصة",
                btnSendCode: "إرسال الرمز",
                codeSent: "تم الإرسال!",
                enterCode: "أدخل الرمز المكون من 6 أرقام"
            }
        };

        window.onload = () => {
            setLang('en');
            document.getElementById('onboarding-modal').style.display = 'flex';
        };

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('html-root').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', lang);
            
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-ar').classList.remove('active');
            document.getElementById(lang === 'en' ? 'btn-en' : 'btn-ar').classList.add('active');

            const t = translations[lang];
            document.getElementById('brand-sub').innerText = t.brandSub;
            document.getElementById('tool-chat').innerText = t.toolChat;
            document.getElementById('tool-image').innerText = t.toolImage;
            document.getElementById('tool-excel').innerText = t.toolExcel;
            document.getElementById('tool-pdf').innerText = t.toolPdf;
            document.getElementById('tool-word').innerText = t.toolWord;
            document.getElementById('welcome-msg').innerHTML = t.welcome;
            document.getElementById('user-input').placeholder = t.inputPlaceholder;
            document.getElementById('send-btn').innerText = t.sendBtn;
            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('label-email').innerText = t.labelEmail;
            document.getElementById('label-code').innerText = t.labelCode;
            document.getElementById('label-age').innerText = t.labelAge;
            document.getElementById('label-role').innerText = t.labelRole;
            document.getElementById('label-goal').innerText = t.labelGoal;
            document.getElementById('btn-start').innerText = t.btnStart;
            document.getElementById('input-code').placeholder = t.enterCode;
            
            // Update button if not in sent state
            if (generatedCode === null) {
                document.getElementById('btn-send-code').innerText = t.btnSendCode;
            } else {
                document.getElementById('btn-send-code').innerText = t.codeSent;
            }
        }

        function selectTool(tool, element) {
            currentTool = tool;
            document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // --- VERIFICATION LOGIC ---
        function sendVerificationCode() {
            const email = document.getElementById('input-email').value;
            const btn = document.getElementById('btn-send-code');
            
            if(!email || !email.includes('@')) {
                alert(currentLang === 'ar' ? "الرجاء إدخال بريد إلكتروني صالح" : "Please enter a valid email");
                return;
            }

            // Generate random 6-digit code
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            
            // Set expiry to 3 minutes from now (180 seconds)
            codeExpiryTime = Date.now() + (3 * 60 * 1000);

            // Change button state
            btn.innerText = translations[currentLang].codeSent;
            btn.style.borderColor = "#94a3b8";
            btn.style.color = "#94a3b8";
            btn.disabled = true;

            // Show code input field
            document.getElementById('verify-group').style.display = 'block';
            
            // Start countdown timer for UI
            let timeLeft = 180;
            if(codeTimerInterval) clearInterval(codeTimerInterval);
            
            codeTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(codeTimerInterval);
                    generatedCode = null; // Invalidate code
                    btn.innerText = translations[currentLang].btnSendCode;
                    btn.style.borderColor = "var(--primary)";
                    btn.style.color = "var(--primary)";
                    btn.disabled = false;
                }
            }, 1000);

            // SHOW THE CODE TO USER (MOCK EMAIL)
            alert(currentLang === 'ar' 
                ? `(نظام تجريبي) رمز التحقق الخاص بك هو: ${generatedCode}\nصالح لمدة 3 دقائق.` 
                : `(Mock System) Your verification code is: ${generatedCode}\nValid for 3 minutes.`);
        }

        function submitOnboarding() {
            const email = document.getElementById('input-email').value;
            const code = document.getElementById('input-code').value;
            const age = document.getElementById('input-age').value;
            const role = document.getElementById('input-role').value;
            
            if(!email || !code || !age || !role) {
                alert(currentLang === 'ar' ? "الرجاء ملء جميع الحقول" : "Please fill all fields");
                return;
            }

            // Validation checks
            if (generatedCode === null) {
                alert(currentLang === 'ar' ? "الرمز منتهي الصلاحية. يرجى طلب رمز جديد." : "Code expired. Please request a new code.");
                return;
            }

            if (Date.now() > codeExpiryTime) {
                alert(currentLang === 'ar' ? "الرمز منتهي الصلاحية. يرجى طلب رمز جديد." : "Code expired. Please request a new code.");
                generatedCode = null;
                return;
            }

            if (code !== generatedCode) {
                alert(currentLang === 'ar' ? "الرمز غير صحيح." : "Incorrect code.");
                return;
            }

            // Success! Code is valid and not expired.
            // Invalidate code immediately (One-time use)
            generatedCode = null;
            if(codeTimerInterval) clearInterval(codeTimerInterval);

            // Hide Modal and enter platform
            document.getElementById('onboarding-modal').style.display = 'none';
            alert(currentLang === 'ar' ? "تم التحقق بنجاح! مرحباً بك في حكيم." : "Verification successful! Welcome to Hakim.");
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            const output = document.getElementById('chat-output');
            const userDiv = document.createElement('div');
            userDiv.className = 'message msg-user';
            userDiv.innerText = text;
            output.appendChild(userDiv);
            
            input.value = '';
            output.scrollTop = output.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message msg-ai';
                aiDiv.innerText = currentLang === 'ar' 
                    ? `(هذا رد تجريبي على أداة: ${currentTool})` 
                    : `(This is a dummy response for tool: ${currentTool})`;
                output.appendChild(aiDiv);
                output.scrollTop = output.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
