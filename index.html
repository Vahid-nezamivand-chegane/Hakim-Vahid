<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakim Vahid | حكيم وحيد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #03050a;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(0, 255, 204, 0.2);
            --gold: #ffd700;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(0, 255, 204, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            padding: 15px;
            overflow-x: hidden;
        }

        [dir="rtl"] body { font-family: 'Cairo', 'Inter', sans-serif; }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1; pointer-events: none;
        }

        .top-bar {
            width: 100%; max-width: 800px; display: flex; justify-content: space-between;
            align-items: center; padding-top: 10px; margin-bottom: 20px;
        }

        .lang-switch {
            display: flex; gap: 5px; background: var(--glass-bg); backdrop-filter: blur(10px);
            padding: 5px; border-radius: 30px; border: 1px solid var(--border);
        }
        .lang-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 6px 14px; border-radius: 20px; cursor: pointer;
            font-weight: bold; transition: all 0.3s ease; font-size: 0.9rem;
        }
        .lang-btn.active { background: var(--primary); color: #000; }

        .buy-btn-header {
            background: var(--gold); color: #000; border: none;
            padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.85rem;
            cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(255,215,0,0.4);
        }

        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; flex: 1; z-index: 10; }

        .brand { text-align: center; margin-bottom: 25px; margin-top: 10px; }
        .brand h1 {
            font-size: 2.8rem; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #00ffcc 50%, #3b82f6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand p { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px;
            padding: 8px 15px; margin-bottom: 15px; font-size: 0.85rem;
        }
        .status-text { color: var(--text-muted); }
        .status-highlight { color: var(--primary); font-weight: bold; }

        .tools-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        .tools {
            display: flex; gap: 10px; overflow-x: auto; width: 100%;
            padding-bottom: 10px; scrollbar-width: none;
        }
        .tools::-webkit-scrollbar { display: none; }
        .tool {
            background: var(--glass-bg); border: 1px solid var(--border); padding: 12px 15px; border-radius: 16px;
            cursor: pointer; text-align: center; min-width: 90px; transition: 0.3s;
        }
        .tool:hover, .tool.active { border-color: var(--primary); background: rgba(0, 255, 204, 0.05); transform: translateY(-3px); }
        .tool-icon { font-size: 1.5rem; margin-bottom: 5px; }
        .tool-name { font-size: 0.75rem; font-weight: 700; }

        .chat-container {
            width: 100%; background: var(--glass-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 24px; padding: 15px;
            display: flex; flex-direction: column; flex: 1; min-height: 400px; margin-bottom: 15px;
        }

        .chat-output {
            flex: 1; overflow-y: auto; margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 12px; padding-inline: 5px;
        }
        .message { padding: 12px 16px; border-radius: 16px; max-width: 90%; line-height: 1.5; font-size: 0.9rem; word-wrap: break-word; white-space: pre-wrap;}
        .msg-ai { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-user { background: linear-gradient(135deg, #00ffcc 0%, #059669 100%); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
        .highlight { color: var(--gold); font-weight: 900; }

        .input-area { display: flex; gap: 8px; width: 100%; }
        input[type="text"] {
            flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border);
            color: var(--text-main); padding: 15px; border-radius: 16px; outline: none; font-size: 0.95rem;
        }
        button.send-btn {
            background: var(--primary); color: #000; border: none;
            padding: 0 20px; border-radius: 16px; font-weight: bold; cursor: pointer; white-space: nowrap;
        }
        button.send-btn:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.5; }
        input[type="text"]:disabled { cursor: not-allowed; opacity: 0.5; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: rgba(15, 23, 42, 0.95); padding: 25px 20px; border-radius: 24px;
            width: 90%; max-width: 400px; border: 1px solid var(--border);
            max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-bottom: 15px; color: #fff; text-align: center; font-size: 1.4rem; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: var(--text-main); outline: none; font-size: 0.9rem;
        }
        
        .email-group { display: flex; gap: 8px; }
        .email-group input { flex: 1; }
        .email-group button { 
            padding: 0 12px; background: transparent; border: 1px solid var(--primary); 
            color: var(--primary); border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.75rem;
        }

        .modal > button {
            width: 100%; padding: 14px; background: var(--primary); color: #000;
            border: none; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 15px;
        }
        
        .timer-text { font-size: 0.75rem; color: var(--gold); margin-top: 5px; display: none; font-weight: bold; }

        /* CAPTCHA */
        .hold-btn {
            width: 100%; padding: 15px; background: var(--glass-bg); color: var(--text-main);
            border: 2px solid var(--primary); border-radius: 12px; font-weight: bold;
            cursor: pointer; position: relative; overflow: hidden; user-select: none;
        }
        .progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: var(--primary); opacity: 0.3; transition: width 0.1s linear;
        }
        .hold-text { position: relative; z-index: 2; pointer-events: none; }

        #ad-container { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; min-height: 50px; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <button class="buy-btn-header" id="btn-buy-header" onclick="buyPremium()">⭐ Buy Premium</button>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('en')" id="btn-en">EN</button>
            <button class="lang-btn" onclick="setLang('ar')" id="btn-ar">AR</button>
        </div>
    </div>

    <div class="container">
        <div class="brand">
            <h1 id="brand-title">Hakim Vahid</h1>
            <p id="brand-sub">The Ultimate AI Hub</p>
        </div>

        <div class="status-bar">
            <span class="status-text" id="status-label">Free Questions Left Today:</span>
            <span class="status-highlight" id="status-count">30</span>
        </div>

        <div class="tools-wrapper">
            <div class="tools">
                <div class="tool active" onclick="selectTool('chat', this)"><div class="tool-icon">💬</div><div class="tool-name" id="tool-chat">Chat</div></div>
                <div class="tool" onclick="selectTool('image', this)"><div class="tool-icon">🎨</div><div class="tool-name" id="tool-image">Image</div></div>
                <div class="tool" onclick="selectTool('excel', this)"><div class="tool-icon">📊</div><div class="tool-name" id="tool-excel">Excel</div></div>
                <div class="tool" onclick="selectTool('pdf', this)"><div class="tool-icon">📄</div><div class="tool-name" id="tool-pdf">PDF</div></div>
                <div class="tool" onclick="selectTool('word', this)"><div class="tool-icon">📝</div><div class="tool-name" id="tool-word">Word</div></div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-output" id="chat-output">
                <div class="message msg-ai" id="welcome-msg"></div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Please register first to chat..." onkeypress="handleKeyPress(event)" disabled>
                <button class="send-btn" onclick="sendMessage()" id="send-btn" disabled>Send</button>
            </div>
        </div>
        
        <div id="ad-container">
            <script async="async" data-cfasync="false" src="https://bauval.org/21/62cbe1d193a0566be9b58d86a8730917"></script>
            <div id="container-62cbe1d193a0566be9b58d86a8730917"></div>
        </div>
    </div>

    <!-- CAPTCHA Modal -->
    <div class="modal-overlay" id="captcha-modal">
        <div class="modal" style="text-align: center; border-color: var(--primary);">
            <h2 id="captcha-title">Human Verification</h2>
            <p class="captcha-desc" id="captcha-desc" style="margin-bottom: 20px; color: var(--text-muted);">Hold the button below to prove you are human.</p>
            <button class="hold-btn" id="hold-btn" onmousedown="startHold()" onmouseup="endHold()" onmouseleave="endHold()" ontouchstart="startHold(event)" ontouchend="endHold(event)">
                <div class="progress-bar" id="captcha-progress"></div>
                <span class="hold-text" id="hold-text">Hold to Verify</span>
            </button>
        </div>
    </div>

    <!-- Onboarding Modal -->
    <div class="modal-overlay" id="onboarding-modal">
        <div class="modal">
            <h2 id="modal-title">Access Hakim Vahid</h2>
            <div class="form-group">
                <label id="label-email">Email Address</label>
                <div class="email-group">
                    <input type="email" id="input-email" placeholder="you@gmail.com">
                    <button type="button" onclick="sendVerificationCode()" id="btn-send-code">Send Code</button>
                </div>
            </div>
            <div class="form-group" id="verify-group" style="display: none;">
                <label id="label-code">Verification Code (Check your email)</label>
                <input type="text" id="input-code" placeholder="Enter 6-digit code" maxlength="6">
                <div class="timer-text" id="timer-text">Time left: 03:00</div>
            </div>
            <div class="form-group">
                <label id="label-age">Age</label>
                <input type="number" id="input-age" placeholder="e.g., 25" min="1">
            </div>
            <div class="form-group">
                <label id="label-role">Your Profession</label>
                <input type="text" id="input-role" placeholder="Engineer, Doctor, Student...">
            </div>
            <button onclick="submitOnboarding()" id="btn-start">Initialize Platform</button>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let currentTool = 'chat';
        let generatedCode = null;
        let codeExpiryTime = null;
        let codeTimerInterval = null;
        
        let holdTimer;
        let holdProgress = 0;
        let isVerifiedHuman = false;

        const MAX_FREE_QUESTIONS = 30;
        let questionsUsed = parseInt(localStorage.getItem('hakim_used')) || 0;
        let isPremium = localStorage.getItem('hakim_premium') === 'true';
        let lastUsedDate = localStorage.getItem('hakim_date');
        let today = new Date().toDateString();

        if (lastUsedDate !== today) {
            questionsUsed = 0;
            localStorage.setItem('hakim_used', 0);
            localStorage.setItem('hakim_date', today);
        }

        const translations = {
            en: {
                brandSub: "The Ultimate AI Hub",
                welcome: "Greetings. I am <span class='highlight'>Hakim Vahid</span>. I am an advanced super-intelligence. Created by <span class='highlight'>Vahid Nezamivand Chegane</span>.",
                inputPlaceholder: "Please register first to chat...",
                statusLabel: "Free Questions Left Today:",
                slowDown: "(System busy... generating response)",
            },
            ar: {
                brandSub: "المركز العالمي للذكاء الاصطناعي",
                welcome: "تحياتي. أنا <span class='highlight'>حكيم وحيد</span>. أنا ذكاء خارق متقدم. صممه <span class='highlight' dir='ltr' style='display: inline-block;'>Vahid Nezamivand Chegane</span>.",
                inputPlaceholder: "الرجاء التسجيل أولاً للمحادثة...",
                statusLabel: "الأسئلة المجانية المتبقية اليوم:",
                slowDown: "(النظام مشغول... جاري التفكير)",
            }
        };

        // --- INITIALIZATION ---
        window.onload = () => {
            setLang('en');
            updateStatusBar();
            
            const savedEmail = localStorage.getItem('hakim_user_email');
            if(savedEmail) {
                isVerifiedHuman = true;
                unlockChat();
            } else {
                document.getElementById('captcha-modal').style.display = 'flex';
            }
        };

        function unlockChat() {
            document.getElementById('user-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('user-input').placeholder = "Ask Hakim anything...";
        }

        // --- CAPTCHA LOGIC ---
        function startHold(e) {
            if (e) e.preventDefault();
            holdProgress = 0;
            const btn = document.getElementById('hold-btn');
            btn.querySelector('.hold-text').innerText = "Verifying...";
            
            holdTimer = setInterval(() => {
                holdProgress += 5;
                document.getElementById('captcha-progress').style.width = holdProgress + '%';
                if (holdProgress >= 100) {
                    clearInterval(holdTimer);
                    verifySuccess();
                }
            }, 100);
        }

        function endHold(e) {
            if (e) e.preventDefault();
            clearInterval(holdTimer);
            if (holdProgress < 100) {
                document.getElementById('captcha-progress').style.width = '0%';
                document.getElementById('hold-btn').querySelector('.hold-text').innerText = "Hold to Verify";
            }
        }

        function verifySuccess() {
            isVerifiedHuman = true;
            const btn = document.getElementById('hold-btn');
            btn.querySelector('.hold-text').innerText = "Verified!";
            btn.style.background = 'var(--primary)';
            btn.style.color = '#000';
            
            setTimeout(() => {
                document.getElementById('captcha-modal').style.display = 'none';
                if(!localStorage.getItem('hakim_user_email')) {
                    document.getElementById('onboarding-modal').style.display = 'flex';
                } else {
                    unlockChat();
                }
            }, 800);
        }

        // --- UI UPDATES ---
        function updateStatusBar() {
            document.getElementById('status-label').innerText = translations[currentLang].statusLabel;
            if (isPremium) {
                document.getElementById('status-label').innerText = "Premium User (Unlimited)";
                document.getElementById('status-count').innerText = "∞";
                document.getElementById('btn-buy-header').style.display = 'none';
            } else {
                document.getElementById('status-count').innerText = Math.max(0, MAX_FREE_QUESTIONS - questionsUsed);
            }
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('html-root').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', lang);
            
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-ar').classList.remove('active');
            document.getElementById(lang === 'en' ? 'btn-en' : 'btn-ar').classList.add('active');

            const t = translations[lang];
            document.getElementById('brand-sub').innerText = t.brandSub;
            document.getElementById('welcome-msg').innerHTML = t.welcome;
            if(!localStorage.getItem('hakim_user_email')) {
                document.getElementById('user-input').placeholder = t.inputPlaceholder;
            }
            updateStatusBar();
        }

        function selectTool(tool, element) {
            currentTool = tool;
            document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // --- ONBOARDING (REGISTRATION) ---
        async function sendVerificationCode() {
            const email = document.getElementById('input-email').value;
            const btn = document.getElementById('btn-send-code');
            const timerText = document.getElementById('timer-text');
            
            if(!email || !email.includes('@')) {
                alert("Please enter a valid email");
                return;
            }

            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                // تغییر آدرس به API پروژه Pages
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert("Server Error: " + data.error);
                    btn.innerText = "Send Code";
                    btn.disabled = false;
                    return;
                }

                btn.innerText = "Code Sent!";
                document.getElementById('verify-group').style.display = 'block';
                
                let timeLeft = 180;
                timerText.style.display = 'block';
                if(codeTimerInterval) clearInterval(codeTimerInterval);
                
                codeTimerInterval = setInterval(() => {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerText.innerText = `Time left: 0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    if (timeLeft <= 0) {
                        clearInterval(codeTimerInterval);
                        btn.innerText = "Send Code";
                        btn.disabled = false;
                        timerText.style.display = 'none';
                    }
                }, 1000);

            } catch (error) {
                alert("Connection Error: " + error.message);
                btn.innerText = "Send Code";
                btn.disabled = false;
            }
        }

        async function submitOnboarding() {
            const email = document.getElementById('input-email').value;
            const code = document.getElementById('input-code').value;
            const age = document.getElementById('input-age').value;
            const role = document.getElementById('input-role').value;
            
            if(!email || !code || !age || !role) {
                alert("Please fill all fields");
                return;
            }

            const btn = document.getElementById('btn-start');
            btn.innerText = "Verifying...";

            try {
                // تغییر آدرس به API پروژه Pages
                const response = await fetch("/api/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, code, age, role })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert("Verification Error: " + data.error);
                    btn.innerText = "Initialize Platform";
                    return;
                }

                localStorage.setItem('hakim_user_email', email);
                localStorage.setItem('hakim_used', data.user.used);
                
                if(codeTimerInterval) clearInterval(codeTimerInterval);
                document.getElementById('onboarding-modal').style.display = 'none';
                unlockChat();
                updateStatusBar();

            } catch (error) {
                alert("Connection Error: " + error.message);
                btn.innerText = "Initialize Platform";
            }
        }

        // --- CHAT LOGIC ---
        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        async function buyPremium() {
            const email = localStorage.getItem('hakim_user_email');
            if(!email) {
                alert("Please register first.");
                return;
            }
            try {
                // تغییر آدرس به API پروژه Pages
                const response = await fetch("/api/create-payment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                if (data.invoice_url) window.location.href = data.invoice_url;
                else alert("Error creating payment.");
            } catch (error) {
                alert("Connection error.");
            }
        }

        async function sendMessage() {
            const userEmail = localStorage.getItem('hakim_user_email');
            if (!userEmail) {
                document.getElementById('onboarding-modal').style.display = 'flex';
                return;
            }

            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            if (!isPremium && questionsUsed >= MAX_FREE_QUESTIONS) {
                alert("Daily limit reached. Please buy premium.");
                return;
            }

            const output = document.getElementById('chat-output');
            const userDiv = document.createElement('div');
            userDiv.className = 'message msg-user';
            userDiv.innerText = text;
            output.appendChild(userDiv);
            
            input.value = '';
            output.scrollTop = output.scrollHeight;

            let delayTime = 0;
            if (!isPremium) {
                if (questionsUsed > 20) delayTime = 5000;
                else if (questionsUsed > 10) delayTime = 2500;
                else delayTime = 800;
            }

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message msg-ai';
            aiDiv.innerText = "Thinking...";
            output.appendChild(aiDiv);
            output.scrollTop = output.scrollHeight;

            if (delayTime > 0) {
                setTimeout(() => { aiDiv.innerText = translations[currentLang].slowDown; }, 1000);
                await new Promise(resolve => setTimeout(resolve, delayTime));
            }

            try {
                // تغییر آدرس به API پروژه Pages
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text, email: userEmail })
                });
                
                const data = await response.json();
                
                if(data.reply === "UNAUTHORIZED") {
                    localStorage.removeItem('hakim_user_email');
                    alert("Session expired. Please register again.");
                    document.getElementById('onboarding-modal').style.display = 'flex';
                    return;
                }

                if(data.reply === "LIMIT_REACHED") {
                    aiDiv.innerText = "Daily limit reached.";
                    alert("You have reached your daily 30 free questions. Please buy premium.");
                    return;
                }

                if(data.reply) {
                    aiDiv.innerText = data.reply;
                    questionsUsed = data.used;
                    localStorage.setItem('hakim_used', questionsUsed);
                    updateStatusBar();
                } else {
                    aiDiv.innerText = "Error: Unknown response";
                }
            } catch (error) {
                aiDiv.innerText = "Connection error.";
            }
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
