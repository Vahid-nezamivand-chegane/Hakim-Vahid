<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakim Vahid | حكيم وحيد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #03050a;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(0, 255, 204, 0.2);
            --gold: #ffd700;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(0, 255, 204, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            padding: 15px;
            overflow-x: hidden;
        }

        [dir="rtl"] body { font-family: 'Cairo', 'Inter', sans-serif; }

        /* Futuristic Grid Overlay */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1; pointer-events: none;
        }

        /* Top Navigation Bar */
        .top-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
            padding-top: 10px;
            margin-bottom: 20px;
        }
        [dir="rtl"] .top-bar { justify-content: flex-end; }

        .lang-switch {
            display: flex; gap: 5px;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            padding: 5px; border-radius: 30px; border: 1px solid var(--border);
            box-shadow: 0 0 15px rgba(0,255,204,0.1);
        }
        .lang-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 6px 14px; border-radius: 20px; cursor: pointer;
            font-weight: bold; transition: all 0.3s ease; font-size: 0.9rem;
        }
        .lang-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }

        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; flex: 1; z-index: 10; }

        /* Brand */
        .brand { text-align: center; margin-bottom: 25px; margin-top: 10px; }
        .brand h1 {
            font-size: 2.8rem; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #00ffcc 50%, #3b82f6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px; text-shadow: 0 0 40px rgba(0, 255, 204, 0.3);
            animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
            100% { text-shadow: 0 0 50px rgba(0, 255, 204, 0.6); }
        }
        .brand p { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        /* Tools Scrollable Area */
        .tools-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        .tools {
            display: flex; gap: 10px; overflow-x: auto; width: 100%;
            padding-bottom: 10px; scroll-snap-type: x mandatory;
            scrollbar-width: none; -ms-overflow-style: none;
            padding-inline: 5px;
        }
        .tools::-webkit-scrollbar { display: none; }
        
        .tools-wrapper::after {
            content: ""; position: absolute; top: 0; bottom: 10px; width: 30px; pointer-events: none; z-index: 2;
        }
        [dir="ltr"] .tools-wrapper::after { right: -5px; background: linear-gradient(to left, var(--bg-dark), transparent); }
        [dir="rtl"] .tools-wrapper::after { left: -5px; background: linear-gradient(to right, var(--bg-dark), transparent); }

        .tool {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 12px 15px; border-radius: 16px;
            cursor: pointer; text-align: center; min-width: 90px;
            scroll-snap-align: start;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center;
        }
        .tool:hover, .tool.active {
            border-color: var(--primary); background: rgba(0, 255, 204, 0.05);
            transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 255, 204, 0.15);
        }
        .tool-icon { font-size: 1.5rem; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(0,255,204,0.4)); }
        .tool-name { font-size: 0.75rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }

        /* Chat Area */
        .chat-container {
            width: 100%; background: var(--glass-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 24px; padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0, 255, 204, 0.1);
            display: flex; flex-direction: column; flex: 1; min-height: 400px; margin-bottom: 15px;
        }

        .chat-output {
            flex: 1; overflow-y: auto; margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
            padding-inline: 5px;
        }
        
        .message { padding: 12px 16px; border-radius: 16px; max-width: 90%; line-height: 1.5; font-size: 0.9rem; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-ai {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            align-self: flex-start; border-bottom-left-radius: 4px;
        }
        [dir="rtl"] .msg-ai { border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
        
        .msg-user {
            background: linear-gradient(135deg, #00ffcc 0%, #059669 100%);
            color: #000; font-weight: 500;
            align-self: flex-end; border-bottom-right-radius: 4px;
        }
        [dir="rtl"] .msg-user { border-bottom-right-radius: 16px; border-bottom-left-radius: 4px; }
        
        .highlight { color: var(--gold); font-weight: 900; }

        /* Input Area */
        .input-area { display: flex; gap: 8px; width: 100%; }
        input[type="text"] {
            flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border);
            color: var(--text-main); padding: 15px; border-radius: 16px;
            font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.3s; min-width: 0;
        }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        
        button.send-btn {
            background: var(--primary); color: #000; border: none;
            padding: 0 20px; border-radius: 16px; font-weight: bold; font-size: 0.95rem;
            cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px var(--primary-glow);
            white-space: nowrap;
        }
        button.send-btn:hover { background: #00cca3; transform: scale(1.05); }

        /* Onboarding Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        @media (min-width: 600px) {
            .modal-overlay { align-items: center; }
        }

        .modal {
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(30px);
            padding: 25px 20px; border-radius: 24px 24px 0 0; width: 100%; max-width: 100%;
            border: 1px solid var(--border); border-bottom: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(0, 255, 204, 0.2);
            animation: slideUp 0.4s ease; max-height: 90vh; overflow-y: auto;
        }
        @media (min-width: 600px) {
            .modal { border-radius: 24px; max-width: 400px; border-bottom: 1px solid var(--border); animation: zoomIn 0.4s ease; }
            @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal h2 { margin-bottom: 15px; color: #fff; text-align: center; font-size: 1.4rem; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: var(--text-main); font-family: inherit; outline: none; transition: 0.3s; font-size: 0.9rem;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        
        .email-group { display: flex; gap: 8px; }
        .email-group input { flex: 1; }
        .email-group button { 
            padding: 0 12px; background: transparent; border: 1px solid var(--primary); 
            color: var(--primary); border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.3s;
        }
        .email-group button:hover { background: rgba(0, 255, 204, 0.1); }
        .email-group button:disabled { border-color: var(--text-muted); color: var(--text-muted); cursor: not-allowed; }

        .modal > button {
            width: 100%; padding: 14px; background: var(--primary); color: #000;
            border: none; border-radius: 12px; font-weight: 900; font-size: 1rem;
            cursor: pointer; margin-top: 15px; transition: 0.3s; box-shadow: 0 0 20px var(--primary-glow);
        }
        .modal > button:hover { background: #00cca3; transform: scale(1.02); }

        /* Timer Text */
        .timer-text { font-size: 0.75rem; color: var(--gold); margin-top: 5px; display: none; font-weight: bold; }

        /* Toast Notification */
        .toast-container {
            position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(10px);
            border: 1px solid var(--primary); border-radius: 16px;
            padding: 12px 18px; display: flex; flex-direction: column; align-items: center;
            gap: 8px; z-index: 2000; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px var(--primary-glow); width: 90%; max-width: 320px;
        }
        .toast-container.show { top: 20px; }
        .toast-title { color: var(--text-main); font-size: 0.85rem; font-weight: bold; }
        .toast-code-box {
            display: flex; align-items: center; justify-content: space-between; width: 100%;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 10px;
            border: 1px dashed var(--primary);
        }
        .toast-code { font-size: 1.4rem; font-weight: 900; color: var(--primary); letter-spacing: 3px; }
        .toast-copy-btn {
            background: var(--primary); color: #000; border: none; padding: 6px 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.8rem;
        }
        .toast-copy-btn:hover { background: #00cca3; }
    </style>
</head>
<body>

    <!-- Custom Toast for Code -->
    <div class="toast-container" id="toast">
        <div class="toast-title" id="toast-title">Your Verification Code</div>
        <div class="toast-code-box">
            <span class="toast-code" id="toast-code-text">------</span>
            <button class="toast-copy-btn" onclick="copyToastCode()" id="toast-copy-btn">Copy</button>
        </div>
    </div>

    <!-- Top Bar for Language -->
    <div class="top-bar">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('en')" id="btn-en">EN</button>
            <button class="lang-btn" onclick="setLang('ar')" id="btn-ar">AR</button>
        </div>
    </div>

    <div class="container">
        <div class="brand">
            <h1 id="brand-title">Hakim Vahid</h1>
            <p id="brand-sub">The Ultimate AI Hub</p>
        </div>

        <div class="tools-wrapper">
            <div class="tools">
                <div class="tool active" onclick="selectTool('chat', this)">
                    <div class="tool-icon">💬</div>
                    <div class="tool-name" id="tool-chat">Chat</div>
                </div>
                <div class="tool" onclick="selectTool('image', this)">
                    <div class="tool-icon">🎨</div>
                    <div class="tool-name" id="tool-image">Image</div>
                </div>
                <div class="tool" onclick="selectTool('excel', this)">
                    <div class="tool-icon">📊</div>
                    <div class="tool-name" id="tool-excel">Excel</div>
                </div>
                <div class="tool" onclick="selectTool('pdf', this)">
                    <div class="tool-icon">📄</div>
                    <div class="tool-name" id="tool-pdf">PDF</div>
                </div>
                <div class="tool" onclick="selectTool('word', this)">
                    <div class="tool-icon">📝</div>
                    <div class="tool-name" id="tool-word">Word</div>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-output" id="chat-output">
                <div class="message msg-ai" id="welcome-msg"></div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Ask Hakim anything..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()" id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- Onboarding Modal -->
    <div class="modal-overlay" id="onboarding-modal">
        <div class="modal">
            <h2 id="modal-title">Access Hakim Vahid</h2>
            
            <div class="form-group">
                <label id="label-email">Email Address</label>
                <div class="email-group">
                    <input type="email" id="input-email" placeholder="you@example.com">
                    <button type="button" onclick="sendVerificationCode()" id="btn-send-code">Send Code</button>
                </div>
            </div>

            <div class="form-group" id="verify-group" style="display: none;">
                <label id="label-code">Verification Code</label>
                <input type="text" id="input-code" placeholder="Enter 6-digit code" maxlength="6">
                <div class="timer-text" id="timer-text">Time left: 03:00</div>
            </div>

            <div class="form-group">
                <label id="label-age">Age</label>
                <input type="number" id="input-age" placeholder="e.g., 25" min="1">
            </div>

            <div class="form-group">
                <label id="label-role">Your Profession</label>
                <input type="text" id="input-role" placeholder="Engineer, Doctor, Student...">
            </div>

            <div class="form-group">
                <label id="label-goal">Primary Goal</label>
                <select id="input-goal">
                    <option value="writing">Writing & Research</option>
                    <option value="coding">Coding & Analysis</option>
                    <option value="business">Business & Finance</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <button onclick="submitOnboarding()" id="btn-start">Initialize Platform</button>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let currentTool = 'chat';
        
        let generatedCode = null;
        let codeExpiryTime = null;
        let codeTimerInterval = null;

        const translations = {
            en: {
                brandSub: "The Ultimate AI Hub",
                toolChat: "Chat", toolImage: "Image", toolExcel: "Excel", toolPdf: "PDF", toolWord: "Word",
                welcome: "Greetings. I am <span class='highlight'>Hakim Vahid</span>. I am not just an AI; I am an advanced super-intelligence and the ultimate unified platform, possessing the convergence of all AI capabilities in one place. Created by <span class='highlight'>Vahid Nezamivand Chegane</span>.",
                inputPlaceholder: "Ask Hakim anything...",
                sendBtn: "Send",
                modalTitle: "Access Hakim Vahid",
                labelEmail: "Email Address", labelCode: "Verification Code", labelAge: "Age", labelRole: "Your Profession", labelGoal: "Primary Goal",
                btnStart: "Initialize Platform",
                btnSendCode: "Send Code",
                codeSent: "Code Sent",
                timerText: "Time left: ",
                enterCode: "Enter 6-digit code",
                toastTitle: "Your Verification Code",
                btnCopy: "Copy",
                copied: "Copied!"
            },
            ar: {
                brandSub: "المركز العالمي للذكاء الاصطناعي",
                toolChat: "محادثة", toolImage: "صورة", toolExcel: "إكسل", toolPdf: "بي دي إف", toolWord: "وورد",
                welcome: "تحياتي. أنا <span class='highlight'>حكيم وحيد</span>. أنا لست مجرد ذكاء اصطناعي؛ بل أنا ذكاء خارق متقدم ومنصة موحدة شاملة، أمتلك تقارب جميع قدرات الذكاء الاصطناعي في مكان واحد. صممه <span class='highlight' dir='ltr' style='font-family: Inter, sans-serif; display: inline-block;'>Vahid Nezamivand Chegane</span>.",
                inputPlaceholder: "اسأل حكيماً أي شيء...",
                sendBtn: "إرسال",
                modalTitle: "دخول حكيم وحيد",
                labelEmail: "البريد الإلكتروني", labelCode: "رمز التحقق", labelAge: "العمر", labelRole: "مهنتك", labelGoal: "الهدف الأساسي",
                btnStart: "تهيئة المنصة",
                btnSendCode: "إرسال الرمز",
                codeSent: "تم الإرسال",
                timerText: "الوقت المتبقي: ",
                enterCode: "أدخل الرمز المكون من 6 أرقام",
                toastTitle: "رمز التحقق الخاص بك",
                btnCopy: "نسخ",
                copied: "تم النسخ!"
            }
        };

        window.onload = () => {
            setLang('en');
            document.getElementById('onboarding-modal').style.display = 'flex';
        };

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('html-root').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', lang);
            
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-ar').classList.remove('active');
            document.getElementById(lang === 'en' ? 'btn-en' : 'btn-ar').classList.add('active');

            const t = translations[lang];
            document.getElementById('brand-sub').innerText = t.brandSub;
            document.getElementById('tool-chat').innerText = t.toolChat;
            document.getElementById('tool-image').innerText = t.toolImage;
            document.getElementById('tool-excel').innerText = t.toolExcel;
            document.getElementById('tool-pdf').innerText = t.toolPdf;
            document.getElementById('tool-word').innerText = t.toolWord;
            document.getElementById('welcome-msg').innerHTML = t.welcome;
            document.getElementById('user-input').placeholder = t.inputPlaceholder;
            document.getElementById('send-btn').innerText = t.sendBtn;
            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('label-email').innerText = t.labelEmail;
            document.getElementById('label-code').innerText = t.labelCode;
            document.getElementById('label-age').innerText = t.labelAge;
            document.getElementById('label-role').innerText = t.labelRole;
            document.getElementById('label-goal').innerText = t.labelGoal;
            document.getElementById('btn-start').innerText = t.btnStart;
            document.getElementById('input-code').placeholder = t.enterCode;
            document.getElementById('toast-copy-btn').innerText = t.btnCopy;
            document.getElementById('toast-title').innerText = t.toastTitle;
            
            if (generatedCode === null) {
                document.getElementById('btn-send-code').innerText = t.btnSendCode;
            }
        }

        function selectTool(tool, element) {
            currentTool = tool;
            document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // --- TOAST & COPY LOGIC ---
        function showToast(code) {
            document.getElementById('toast-code-text').innerText = code;
            document.getElementById('toast').classList.add('show');
            setTimeout(() => {
                document.getElementById('toast').classList.remove('show');
            }, 15000);
        }

        function copyToastCode() {
            const code = document.getElementById('toast-code-text').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('toast-copy-btn');
                const originalText = btn.innerText;
                btn.innerText = translations[currentLang].copied;
                btn.style.background = "var(--gold)";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "var(--primary)";
                }, 2000);
            });
        }

        // --- VERIFICATION LOGIC ---
        function sendVerificationCode() {
            const email = document.getElementById('input-email').value;
            const btn = document.getElementById('btn-send-code');
            const timerText = document.getElementById('timer-text');
            
            if(!email || !email.includes('@')) {
                alert(currentLang === 'ar' ? "الرجاء إدخال بريد إلكتروني صالح" : "Please enter a valid email");
                return;
            }

            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            codeExpiryTime = Date.now() + (3 * 60 * 1000);

            btn.innerText = translations[currentLang].codeSent;
            btn.disabled = true;
            document.getElementById('verify-group').style.display = 'block';
            
            showToast(generatedCode);

            let timeLeft = 180;
            timerText.style.display = 'block';
            if(codeTimerInterval) clearInterval(codeTimerInterval);
            
            codeTimerInterval = setInterval(() => {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerText.innerText = `${translations[currentLang].timerText}0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(codeTimerInterval);
                    generatedCode = null;
                    btn.innerText = translations[currentLang].btnSendCode;
                    btn.disabled = false;
                    timerText.style.display = 'none';
                    document.getElementById('input-code').value = '';
                }
            }, 1000);
        }

        function submitOnboarding() {
            const email = document.getElementById('input-email').value;
            const code = document.getElementById('input-code').value;
            const age = document.getElementById('input-age').value;
            const role = document.getElementById('input-role').value;
            
            if(!email || !code || !age || !role) {
                alert(currentLang === 'ar' ? "الرجاء ملء جميع الحقول" : "Please fill all fields");
                return;
            }

            if (generatedCode === null || Date.now() > codeExpiryTime) {
                alert(currentLang === 'ar' ? "الرمز منتهي الصلاحية." : "Code expired.");
                return;
            }

            if (code !== generatedCode) {
                alert(currentLang === 'ar' ? "الرمز غير صحيح." : "Incorrect code.");
                return;
            }

            generatedCode = null;
            if(codeTimerInterval) clearInterval(codeTimerInterval);
            document.getElementById('onboarding-modal').style.display = 'none';
            alert(currentLang === 'ar' ? "تم التحقق بنجاح! مرحباً بك في حكيم." : "Verification successful! Welcome to Hakim.");
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            const output = document.getElementById('chat-output');
            const userDiv = document.createElement('div');
            userDiv.className = 'message msg-user';
            userDiv.innerText = text;
            output.appendChild(userDiv);
            
            input.value = '';
            output.scrollTop = output.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message msg-ai';
                aiDiv.innerText = currentLang === 'ar' 
                    ? `(هذا رد تجريبي على أداة: ${currentTool})` 
                    : `(This is a dummy response for tool: ${currentTool})`;
                output.appendChild(aiDiv);
                output.scrollTop = output.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
